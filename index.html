<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HTML Workbench</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#1b2430;--mute:#66717f;--line:#d8dde4;--accent:#0b7a75;--accent-ink:#fff;--soft:#e4f2f1;--danger:#b4372f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161c;--panel:#1a2129;--ink:#e6ebf0;--mute:#93a0ae;--line:#2d3742;--accent:#3cc4bb;--accent-ink:#06211f;--soft:#1c3331;--danger:#ff8a80}}
:root[data-theme="dark"]{--bg:#11161c;--panel:#1a2129;--ink:#e6ebf0;--mute:#93a0ae;--line:#2d3742;--accent:#3cc4bb;--accent-ink:#06211f;--soft:#1c3331;--danger:#ff8a80}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 16px;font:inherit;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.cap{padding:8px 14px;border-bottom:1px solid var(--line);color:var(--mute);font-size:13px;font-weight:600}
#ta{flex:1;width:100%;border:0;resize:none;padding:14px;background:transparent;color:var(--ink);font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}
#ta:focus-visible{outline-offset:-2px}
#blockPane{flex:1;min-height:0;display:flex;flex-direction:column}
#palette{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
#palette button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
#palette button:hover{border-color:var(--accent)}
#blocks{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.block{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:8px 10px;background:var(--bg)}
.bh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.tag{font-weight:700;font-size:13px}
.acts button{border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:15px;padding:2px 7px;border-radius:6px}
.acts button:hover{background:var(--soft);color:var(--ink)}
.acts button[data-a="del"]:hover{color:var(--danger)}
.block label{display:block;font-size:12px;color:var(--mute);margin-top:6px}
.block input,.block textarea{display:block;width:100%;margin-top:2px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:inherit}
.block textarea{min-height:56px;resize:vertical}
.block textarea.mono{font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace}
.empty{color:var(--mute);text-align:center;margin:24px 0}
iframe{flex:1;width:100%;border:0;background:#fff}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
[hidden]{display:none!important}
@media (max-width:800px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1>HTML Workbench</h1>
  <div class="seg" role="group" aria-label="Editor mode">
    <button id="mText" aria-pressed="true">Text</button>
    <button id="mBlock" aria-pressed="false">Block</button>
  </div>
  <button class="btn" id="copy">Copy HTML</button>
  <button class="btn" id="clear">Clear</button>
</header>
<main>
  <section>
    <div class="cap" id="capL">HTML code</div>
    <textarea id="ta" spellcheck="false" aria-label="HTML code"></textarea>
    <div id="blockPane" hidden>
      <div id="palette"></div>
      <div id="blocks"></div>
    </div>
  </section>
  <section>
    <div class="cap">Live preview</div>
    <iframe id="pv" title="Preview" sandbox="allow-scripts"></iframe>
  </section>
</main>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA=s=>esc(s).replace(/"/g,'&quot;');
const PH="data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="320" height="160"><rect width="100%" height="100%" fill="#cfd8dc"/><text x="50%" y="52%" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#546e7a">Image</text></svg>');
const TYPES={
  h1:{label:'Heading 1',f:[['text','Text']],d:{text:'Big heading'}},
  h2:{label:'Heading 2',f:[['text','Text']],d:{text:'Section heading'}},
  h3:{label:'Heading 3',f:[['text','Text']],d:{text:'Small heading'}},
  p:{label:'Paragraph',f:[['text','Text','area']],d:{text:'Write something here.'}},
  a:{label:'Link',f:[['text','Label'],['href','URL']],d:{text:'Visit link',href:'https://example.com'}},
  img:{label:'Image',f:[['src','Image URL'],['alt','Alt text']],d:{src:PH,alt:'Placeholder'}},
  button:{label:'Button',f:[['text','Label']],d:{text:'Click me'}},
  ul:{label:'List',f:[['text','One item per line','area']],d:{text:'First item\nSecond item\nThird item'}},
  input:{label:'Input',f:[['text','Placeholder']],d:{text:'Type here'}},
  hr:{label:'Divider',f:[],d:{}},
  raw:{label:'Raw HTML',f:[['text','HTML','mono']],d:{text:'<div style="padding:12px;background:#eef">Custom HTML</div>'}}
};
const START='<h1>Hello, world!</h1>\n<p>Edit this HTML, or switch to Block mode to build with blocks.</p>\n<button onclick="alert(\'Hi!\')">Click me</button>';
let mode='text',blocks=[],timer;
const ta=$('#ta');

function ser(b){
  switch(b.type){
    case 'h1':case 'h2':case 'h3':case 'p':return `<${b.type}>${esc(b.text)}</${b.type}>`;
    case 'a':return `<a href="${escA(b.href)}">${esc(b.text)}</a>`;
    case 'img':return `<img src="${escA(b.src)}" alt="${escA(b.alt)}">`;
    case 'button':return `<button>${esc(b.text)}</button>`;
    case 'ul':return `<ul>\n${b.text.split('\n').filter(x=>x.trim()).map(x=>`  <li>${esc(x)}</li>`).join('\n')}\n</ul>`;
    case 'input':return `<input placeholder="${escA(b.text)}">`;
    case 'hr':return '<hr>';
    default:return b.text;
  }
}
const toHTML=()=>blocks.map(ser).join('\n');

function parse(code){
  const d=new DOMParser().parseFromString(code,'text/html'),out=[];
  d.head.querySelectorAll('style').forEach(e=>out.push({type:'raw',text:e.outerHTML}));
  d.body.childNodes.forEach(n=>{
    if(n.nodeType===3){const t=n.textContent.trim();if(t)out.push({type:'p',text:t});return}
    if(n.nodeType!==1)return;
    const t=n.tagName.toLowerCase(),plain=!n.children.length,attrs=[...n.attributes].map(a=>a.name);
    if(['h1','h2','h3','p','button'].includes(t)&&plain&&!attrs.length)out.push({type:t,text:n.textContent});
    else if(t==='a'&&plain&&attrs.every(a=>a==='href'))out.push({type:'a',text:n.textContent,href:n.getAttribute('href')||''});
    else if(t==='img'&&attrs.every(a=>a==='src'||a==='alt'))out.push({type:'img',src:n.getAttribute('src')||'',alt:n.getAttribute('alt')||''});
    else if(t==='ul'&&!attrs.length&&[...n.children].every(c=>c.tagName==='LI'&&!c.children.length&&!c.attributes.length))out.push({type:'ul',text:[...n.children].map(c=>c.textContent).join('\n')});
    else if(t==='input'&&attrs.every(a=>a==='placeholder'))out.push({type:'input',text:n.getAttribute('placeholder')||''});
    else if(t==='hr'&&!attrs.length)out.push({type:'hr'});
    else out.push({type:'raw',text:n.outerHTML});
  });
  return out;
}

function preview(){
  const html=mode==='text'?ta.value:toHTML();
  $('#pv').srcdoc='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><body style="font-family:system-ui,sans-serif;padding:16px;line-height:1.5;color:#1b2430">'+html;
  try{localStorage.setItem('htmlwb',JSON.stringify(html))}catch(e){}
}
function sync(){clearTimeout(timer);timer=setTimeout(preview,120)}

function renderBlocks(){
  const list=$('#blocks');list.innerHTML='';
  if(!blocks.length){list.innerHTML='<p class="empty">No blocks yet. Add one from the buttons above.</p>';return}
  blocks.forEach((b,i)=>{
    const T=TYPES[b.type],el=document.createElement('div');el.className='block';
    el.innerHTML=`<div class="bh"><span class="tag">${T.label}</span><span class="acts"><button data-a="up" title="Move up" aria-label="Move up">↑</button><button data-a="down" title="Move down" aria-label="Move down">↓</button><button data-a="del" title="Delete" aria-label="Delete block">✕</button></span></div>`;
    T.f.forEach(([k,lab,kind])=>{
      const l=document.createElement('label');l.textContent=lab;
      const inp=document.createElement(kind?'textarea':'input');
      if(kind==='mono')inp.className='mono';
      inp.value=b[k]||'';
      inp.oninput=()=>{b[k]=inp.value;sync()};
      l.appendChild(inp);el.appendChild(l);
    });
    el.querySelector('.acts').onclick=e=>{
      const a=e.target.dataset.a;if(!a)return;
      if(a==='del')blocks.splice(i,1);
      else if(a==='up'&&i>0)[blocks[i-1],blocks[i]]=[blocks[i],blocks[i-1]];
      else if(a==='down'&&i<blocks.length-1)[blocks[i+1],blocks[i]]=[blocks[i],blocks[i+1]];
      renderBlocks();preview();
    };
    list.appendChild(el);
  });
}

function setMode(m){
  if(m===mode)return;
  if(m==='block')blocks=parse(ta.value);else ta.value=toHTML();
  mode=m;
  $('#mText').setAttribute('aria-pressed',m==='text');
  $('#mBlock').setAttribute('aria-pressed',m==='block');
  ta.hidden=m!=='text';$('#blockPane').hidden=m!=='block';
  $('#capL').textContent=m==='text'?'HTML code':'Blocks';
  if(m==='block')renderBlocks();
  preview();
}

const pal=$('#palette');
Object.keys(TYPES).forEach(k=>{
  const b=document.createElement('button');b.textContent='+ '+TYPES[k].label;
  b.onclick=()=>{blocks.push({type:k,...TYPES[k].d});renderBlocks();preview();const l=$('#blocks');l.scrollTop=l.scrollHeight};
  pal.appendChild(b);
});

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}
$('#copy').onclick=async()=>{
  const html=mode==='text'?ta.value:toHTML();
  try{await navigator.clipboard.writeText(html)}
  catch(e){const t=document.createElement('textarea');t.value=html;document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(_){}t.remove()}
  toast('HTML copied');
};
$('#clear').onclick=()=>{if(mode==='text')ta.value='';else{blocks=[];renderBlocks()}preview()};
$('#mText').onclick=()=>setMode('text');
$('#mBlock').onclick=()=>setMode('block');
ta.addEventListener('input',sync);
ta.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart;ta.setRangeText('  ',s,ta.selectionEnd,'end');sync()}
});

let saved=null;
try{const r=localStorage.getItem('htmlwb');if(r)saved=JSON.parse(r)}catch(e){}
ta.value=saved!==null?saved:START;
preview();
</script>
</body>
</html>
